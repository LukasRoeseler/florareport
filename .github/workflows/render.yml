name: Render and deploy FLoRA report

on:
  # Daily at 07:00 CEST.
  # CEST = UTC+2 (summer), CET = UTC+1 (winter).
  # Cron uses UTC. We schedule both 05:00 UTC (CEST) and 06:00 UTC (CET)
  # so the build runs at 07:00 local Berlin time year-round.
  schedule:
    - cron: "0 5 * * *"   # 07:00 CEST (Mar–Oct)
    - cron: "0 6 * * *"   # 07:00 CET  (Oct–Mar)

  # Rebuild whenever any source file changes on the default branch.
  push:
    branches: [main]
    paths:
      - "index.qmd"
      - "sections/**"
      - "references.bib"
      - "_quarto.yml"
      - "styles.css"
      - "apa.csl"
      - "data/**"
      - "figures/**"
      - "scripts/**"
      - ".github/workflows/**"

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Pinned to 22.04 (jammy): Posit Public RSPM ships binary R packages for
    # jammy, so setup-r-dependencies installs in ~1 min instead of compiling
    # tidyverse from source for 30+ min on noble.
    runs-on: ubuntu-22.04
    # Guards against the render hanging indefinitely (GitHub's default job
    # timeout is 6 hours) so a stuck run fails fast and visibly instead of
    # silently blocking every subsequent scheduled run. Comfortably above
    # the PDF step's own 15-minute timeout plus the ~5 minutes the rest of
    # the job (R/Quarto setup, data download, HTML render) takes.
    timeout-minutes: 25

    env:
      # URL of the canonical FLoRA CSV. Override via repo variable FLORA_CSV_URL.
      FLORA_CSV_URL: ${{ vars.FLORA_CSV_URL || 'https://raw.githubusercontent.com/forrtproject/FReD-data/refs/heads/main/output/flora.csv' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::knitr
            any::rmarkdown
            any::kableExtra
            any::here
            any::janitor
            any::scales
            any::ggplot2
            any::readr

      - name: Download latest FLoRA dataset
        run: |
          mkdir -p data
          echo "Fetching FLoRA CSV from: $FLORA_CSV_URL"
          curl -L --fail --retry 3 --retry-delay 5 \
               -o data/flora.csv "$FLORA_CSV_URL"
          echo "Downloaded $(wc -l < data/flora.csv) lines."
          head -1 data/flora.csv

      - name: Download APA 7 CSL (if not committed)
        run: |
          if [ ! -f apa.csl ]; then
            echo "Downloading APA 7 CSL..."
            curl -L --fail --retry 3 \
              -o apa.csl \
              https://raw.githubusercontent.com/citation-style-language/styles/master/apa.csl
          fi

      - name: Download FLoRA logo (if not committed)
        run: |
          if [ ! -f logo.svg ]; then
            echo "Downloading FLoRA logo..."
            curl -L --fail --retry 3 \
              -o logo.svg \
              https://raw.githubusercontent.com/forrtproject/flora-explorer/refs/heads/main/logo.svg
          fi

      # The PDF export renders the report's Mermaid diagrams (see
      # sections/pipeline.md) to static images, which requires a headless
      # Chromium. That step hung for hours in CI (job auto-cancelled after
      # GitHub's 6h default timeout) until Chromium was installed explicitly
      # below, and headless-Chrome rendering remains inherently more fragile
      # than plain HTML. Keep it best-effort: `continue-on-error` plus a
      # short per-step timeout mean a flaky PDF render is skipped rather than
      # ever blocking the (required) HTML deploy below. It must run BEFORE
      # the HTML render: `quarto render` always clears the project's
      # output-dir (_site) first, so if this ran after the HTML step it
      # would wipe out the site that step just built.
      - name: Install Chromium for Quarto (PDF/Mermaid rendering)
        run: quarto install chromium --no-prompt
        continue-on-error: true

      - name: Render Quarto report (PDF, best-effort)
        run: quarto render --to typst
        continue-on-error: true
        # Rendering 4 Mermaid diagrams to PNG via headless Chromium plus the
        # Typst compile routinely takes longer than 5 minutes; a step that
        # hits timeout-minutes is killed but still reports conclusion
        # "success" here (continue-on-error masks it), so a too-short limit
        # silently produces no PDF instead of visibly failing. 15 minutes
        # leaves headroom under the job's 25-minute cap for the steps after.
        timeout-minutes: 15

      # The report's HTML pages are the only thing that must build for the
      # site to deploy. Rendering it on its own (rather than a plain
      # `quarto render`, which also builds the "typst" PDF target) keeps the
      # PDF export above from being able to block or break the site update.
      # Running it last also means it (re)populates _site fresh and, via the
      # project's `resources: ["FLoRA-report.pdf"]` entry, copies in the PDF
      # from the step above if that succeeded.
      - name: Render Quarto report (HTML)
        run: quarto render --to html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4