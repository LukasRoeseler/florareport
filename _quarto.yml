project:
  type: website
  output-dir: _site
  render:
    - index.qmd

website:
  title: "FLoRA Report"
  description: "The FORRT Library of Reproduction and Replication Attempts"
  favicon: "https://raw.githubusercontent.com/forrtproject/flora-explorer/refs/heads/main/logo.svg"
  site-url: "https://your-username.github.io/flora-report"
  repo-url: "https://github.com/your-username/flora-report"
  repo-actions: [issue]
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: light
    search: true
    logo: "https://raw.githubusercontent.com/forrtproject/flora-explorer/refs/heads/main/logo.svg"
    logo-alt: "FLoRA logo"
    left:
      - text: "Report"
        href: index.qmd
      - text: "FORRT Replication Hub"
        href: "https://forrt.org/replications/"
  page-footer:
    center: |
      **Recommended citation:** [Author] (`r format(Sys.Date(), '%Y')`).
      *The FORRT Library of Reproduction and Replication Attempts.*
      [URL]. Data: Wallrich, Röseler et al. (2026), OSF.
      [doi.org/10.17605/OSF.IO/9R62X](https://doi.org/10.17605/OSF.IO/9R62X)
    left: |
      Built with [Quarto](https://quarto.org/). Data licensed CC BY 4.0.
    right: "Last updated: today"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    code-tools: false
    citations-hover: true
    crossrefs-hover: true

bibliography: references.bib
csl: apa.csl