project:
  type: website
  output-dir: _site
  render:
    - index.qmd

website:
  title: "FLoRA Report"
  description: "The FORRT Library of Reproduction and Replication Attempts"
  site-url: "https://lukasroeseler.github.io/flora-report"
  repo-url: "https://github.com/lukasroeseler/flora-report"
  repo-actions: [edit, source, issue]
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: light
    search: true
    left:
      - text: "Report"
        href: index.qmd
      - text: "FLoRA Project"
        href: "https://forrt.org/replications/"
      - text: "FReD Explorer"
        href: "https://forrt-replications.shinyapps.io/fred_explorer"
  page-footer:
    left: |
      Built with [Quarto](https://quarto.org/). Data from
      [FLoRA](https://forrt.org/replications/), licensed CC BY 4.0.
    right: "Last updated: today"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3

bibliography: references.bib
csl: apa.csl
