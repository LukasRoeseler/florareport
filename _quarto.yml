project:
  type: website
  output-dir: _site
  resources:
    - "FLoRA-report.pdf"
  render:
    - index.qmd

website:
  description: "The FORRT Library of Reproduction and Replication Attempts"
  favicon: "logo.svg"
  site-url: "https://lukasroeseler.github.io/florareport"
  repo-url: "https://github.com/lukasroeseler/florareport"
  repo-actions: [issue]
  page-navigation: true
  back-to-top-navigation: false
  navbar:
    background: light
    search: true
    logo: "logo.svg"
    logo-alt: "FLoRA logo"
    logo-href: "index.html"
    title: false
  page-footer:
    center: |
      **Recommended citation:** Röseler, L. et al. (`r format(Sys.Date(), '%Y')`).
      *The FORRT Library of Reproduction and Replication Attempts.*
      [lukasroeseler.github.io/florareport](https://lukasroeseler.github.io/florareport/).
      Data: Wallrich, Röseler et al. (2026), OSF.
      [doi.org/10.17605/OSF.IO/9R62X](https://doi.org/10.17605/OSF.IO/9R62X)
    left: |
      Built with [Quarto](https://quarto.org/). CC BY 4.0.
    right: |
      [FORRT Replication Hub](https://forrt.org/replications/)

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    code-tools: false
    citations-hover: true
    crossrefs-hover: true
  typst:
    output-file: "FLoRA-report"
    toc: true
    toc-depth: 3
    papersize: a4

bibliography: references.bib
csl: apa.csl